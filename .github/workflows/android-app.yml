# 공부 친구 안드로이드 앱(APK) 만들기
# - main 에 앱(app/) 코드가 바뀌어 올라오면 저절로 만들어요.
# - 직접 만들려면: GitHub 저장소 → Actions → "안드로이드 앱 만들기" → Run workflow
# - 다 만들면 Releases 에 APK 가 올라가요. 항상 최신 APK 를 받는 주소:
#   https://github.com/chanwoo03/study-friends/releases/latest/download/study-friends.apk
name: 안드로이드 앱 만들기

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: '앱이 열 사이트 주소'
        required: true
        default: 'http://chanwlab.com/study_friend/'
      release:
        description: 'Releases 에 올리기'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: write   # Releases 에 APK 를 올리려면 필요해요

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: flutter build apk
        env:
          APP_URL: ${{ github.event.inputs.app_url || 'http://chanwlab.com/study_friend/' }}
        run: flutter build apk --release --dart-define=APP_URL="$APP_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: study-friends-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Releases 에 올리기
        if: ${{ github.event_name == 'push' || github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: app-v${{ github.run_number }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk study-friends.apk
          gh release create "$TAG" study-friends.apk \
            --target "$GITHUB_SHA" \
            --title "공부 친구 앱 ($TAG)" \
            --latest \
            --notes "공부 친구 안드로이드 앱이에요. 아래 study-friends.apk 를 받아 휴대폰에서 설치하세요.

          - 설치할 때 '출처를 알 수 없는 앱'을 허용해 주세요. Play 프로텍트 경고는 '무시하고 설치'를 누르면 돼요.
          - 아이디/비밀번호 또는 카카오로 로그인하세요. (구글 로그인은 앱 안에서 안 돼요)
          - 이미 설치했다면 새 APK 를 설치하면 업데이트돼요. 로그인과 데이터는 그대로예요."
