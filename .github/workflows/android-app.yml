# 공부 친구 안드로이드 앱(APK) 만들기
# GitHub 저장소 → Actions → "안드로이드 앱 만들기" → Run workflow 를 누르면
# 몇 분 뒤 아래쪽 Artifacts 에서 study-friends-apk 를 내려받을 수 있어요.
name: 안드로이드 앱 만들기

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: '앱이 열 사이트 주소'
        required: true
        default: 'http://chanwlab.com/study_friend/'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: flutter build apk
        env:
          APP_URL: ${{ github.event.inputs.app_url }}
        run: flutter build apk --release --dart-define=APP_URL="$APP_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: study-friends-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
